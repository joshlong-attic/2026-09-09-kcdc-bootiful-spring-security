services:


  # <.>
  petclinic:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=petclinic'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '4002:5432'

  coffeeshop:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=coffeeshop'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '4001:5432'

  acmewidgets:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=acmewidgets'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '4003:5432'