spring.application.name=auth
#
spring.threads.virtual.enabled=true
#
spring.security.oauth2.authorizationserver.client.spring.registration.client-id=adoptions
spring.security.oauth2.authorizationserver.client.spring.registration.client-secret={noop}adoptions
spring.security.oauth2.authorizationserver.client.spring.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[1]=client_credentials
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[2]=refresh_token
spring.security.oauth2.authorizationserver.client.spring.registration.authorization-grant-types[3]=urn:ietf:params:oauth:grant-type:device_code
spring.security.oauth2.authorizationserver.client.spring.registration.redirect-uris[0]=http://127.0.0.1:8080/login/oauth2/code/adoptions
spring.security.oauth2.authorizationserver.client.spring.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.spring.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.spring.registration.scopes[2]=email
#
spring.security.oauth2.authorizationserver.client.messages.registration.client-id=messages
spring.security.oauth2.authorizationserver.client.messages.registration.client-secret={noop}messages
spring.security.oauth2.authorizationserver.client.messages.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.messages.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.messages.registration.authorization-grant-types[1]=client_credentials
spring.security.oauth2.authorizationserver.client.messages.registration.authorization-grant-types[2]=refresh_token
spring.security.oauth2.authorizationserver.client.messages.registration.authorization-grant-types[3]=urn:ietf:params:oauth:grant-type:device_code
spring.security.oauth2.authorizationserver.client.messages.registration.redirect-uris[0]=http://127.0.0.1:8080/login/oauth2/code/messages
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[2]=email
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[3]=user.write
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[4]=user.read
spring.security.oauth2.authorizationserver.client.messages.registration.scopes[5]=message
#
spring.security.oauth2.authorizationserver.client.javafx.registration.client-id=javafx
spring.security.oauth2.authorizationserver.client.javafx.registration.client-name=Bootiful JavaFX
spring.security.oauth2.authorizationserver.client.javafx.registration.client-authentication-methods[0]=none
spring.security.oauth2.authorizationserver.client.javafx.registration.authorization-grant-types[0]=authorization_code
spring.security.oauth2.authorizationserver.client.javafx.registration.authorization-grant-types[1]=refresh_token
spring.security.oauth2.authorizationserver.client.javafx.registration.redirect-uris[0]=http://127.0.0.1:8385/login/oauth2/code/javafx
spring.security.oauth2.authorizationserver.client.javafx.registration.scopes[0]=openid
spring.security.oauth2.authorizationserver.client.javafx.registration.scopes[1]=profile
spring.security.oauth2.authorizationserver.client.javafx.registration.scopes[2]=email
spring.security.oauth2.authorizationserver.client.javafx.registration.scopes[3]=user.read
spring.security.oauth2.authorizationserver.client.javafx.require-proof-key=true
#
server.port=9090
logging.level.org.springframework=debug
#
spring.datasource.url=jdbc:postgresql://localhost/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.flyway.baseline-on-migrate=true