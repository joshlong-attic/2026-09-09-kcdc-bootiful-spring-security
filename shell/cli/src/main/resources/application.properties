spring.application.name=cli
#
spring.security.oauth2.client.registration.messages.provider=spring
spring.security.oauth2.client.registration.messages.client-id=messages
spring.security.oauth2.client.registration.messages.client-secret=messages
spring.security.oauth2.client.registration.messages.authorization-grant-type=urn:ietf:params:oauth:grant-type:device_code
spring.security.oauth2.client.registration.messages.scope[0]=message
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:9090
logging.level.org.springframework.security=debug
spring.shell.interactive.enabled=true